<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen House – Order Smart. Skip the Queue!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--or:#F26A1B;--or2:#D4540B;--ink:#2B1B10;--mut:#7A6858;--cream:#FFF4E2;--card:#fff;--line:#F0DFC6;--ok:#2E9E5B;--bad:#D23B3B;--r:18px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#FBEBD3;--mut:#C3AE97;--cream:#1E140D;--card:#2A1D14;--line:#43301F;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,h3,.logo{font-family:'Bricolage Grotesque','DM Sans',sans-serif;line-height:1.1;margin:0}
button{font:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.wrap{max-width:1100px;margin:auto;padding:0 18px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cream);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:10px;height:62px}.sp{flex:1}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;background:none;border:0;color:var(--ink);padding:0}
.logo i{font-style:normal;background:var(--or);width:34px;height:34px;border-radius:11px 11px 11px 3px;display:grid;place-items:center;font-size:18px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;background:var(--or);color:#fff;transition:.15s}
.btn:hover{background:var(--or2)}.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.ghost:hover{border-color:var(--or)}
.btn.sm{padding:6px 13px;font-size:14px}.btn.bad{background:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:48px 0}
.hero h1{font-size:clamp(40px,7vw,76px);font-weight:800;letter-spacing:-.03em}.hero h1 em{font-style:normal;color:var(--or)}
.hero p{color:var(--mut);font-size:18px;max-width:46ch}.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.plate{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 38%,#FFD9AE 39% 60%,var(--or) 61%);display:grid;place-items:center;font-size:clamp(90px,16vw,170px);box-shadow:0 30px 60px -20px rgba(242,106,27,.55);position:relative}
.plate b{position:absolute;font-size:clamp(34px,6vw,60px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.dish{padding:0;overflow:hidden;display:flex;flex-direction:column}.dish .art{height:120px;display:grid;place-items:center;font-size:62px}
.dish .in{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}.dish .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.price{font-weight:800;color:var(--or2);font-size:18px}.dish.off{opacity:.5}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:10px 0 50px}
.steps .card span{font-size:34px}
.auth{max-width:440px;margin:36px auto}.auth h2{font-size:32px;margin-bottom:6px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
input,select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
input:focus,select:focus{border-color:var(--or);outline:0}.err{color:var(--bad);font-size:13px;margin-top:3px}
.hint{background:var(--cream);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--mut);margin-top:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0}.tab{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:700;white-space:nowrap}
.tab.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;padding-top:22px}.top h2{font-size:30px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}.stats b{font-size:28px;display:block;font-family:'Bricolage Grotesque'}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;background:#FFE3C7;color:var(--or2)}
.pill.Ready,.pill.Completed{background:#D8F3E2;color:#1E7A45}.pill.Preparing{background:#FFF0B8;color:#8A6500}
.track{display:flex;margin:12px 0 4px}.track div{flex:1;text-align:center;font-size:11px;color:var(--mut);position:relative}
.track div:before{content:"";display:block;width:14px;height:14px;border-radius:50%;background:var(--line);margin:0 auto 4px;position:relative;z-index:1}
.track div:after{content:"";position:absolute;top:6px;left:-50%;width:100%;height:3px;background:var(--line)}.track div:first-child:after{display:none}
.track .d{color:var(--ink);font-weight:700}.track .d:before,.track .d:after{background:var(--or)}
.token{font-family:'Bricolage Grotesque';font-weight:800;font-size:22px;background:var(--ink);color:var(--cream);border-radius:12px;padding:6px 12px;display:inline-block;letter-spacing:.05em}
.list{display:grid;gap:12px}.oh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.qty{display:inline-flex;align-items:center;gap:8px}.qty button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:800}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:14px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--or)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.cols{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:12px 20px;border-radius:999px;z-index:9;font-weight:700;max-width:90vw}
footer{text-align:center;color:var(--mut);padding:30px 0;font-size:14px}.muted{color:var(--mut)}
@media(max-width:760px){.hero,.cols,.steps,.two{grid-template-columns:1fr}.plate{max-width:320px;margin:auto}nav .hide{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;
const KEY='kh_v1',STAGES=['Placed','Accepted','Preparing','Ready','Completed'];
const NEXT={Placed:'Accept order',Accepted:'Start preparing',Preparing:'Mark ready',Ready:'Complete pickup'};
const M=(id,name,price,cat,e,bg)=>({id,name,price,cat,e,bg,on:true});
const seed={session:null,tok:103,
users:[{id:1,name:'Campus Admin',email:'admin@kitchenhouse.edu',pw:'admin123',role:'admin'},
{id:2,name:'Ravi (Chef)',email:'kitchen@kitchenhouse.edu',pw:'kitchen123',role:'kitchen'},
{id:3,name:'Ananya Rao',email:'student@college.edu',pw:'student123',role:'student',roll:'CS21045',phone:'9876543210'}],
menu:[M(1,'Masala Dosa',60,'Breakfast','🥞','#FFE9C2'),M(2,'Veg Biryani',90,'Meals','🍛','#FFD9AE'),M(3,'Paneer Wrap',70,'Snacks','🌯','#FFE3C7'),M(4,'Crispy Samosa',20,'Snacks','🥟','#FFEFC9'),M(5,'Chicken Burger',85,'Snacks','🍔','#FFD6B5'),M(6,'Cold Coffee',45,'Drinks','🧋','#F6E2CF'),M(7,'Masala Chai',15,'Drinks','☕','#F9E4C8'),M(8,'Veg Thali',110,'Meals','🍱','#FFDDB8'),M(9,'Fresh Lime',25,'Drinks','🍋','#FFF3B8'),M(10,'Choco Brownie',50,'Desserts','🍫','#EBD3C0')],
slots:['12:00','12:15','12:30','12:45','13:00','13:15'].map((t,i)=>({id:i+1,time:t,cap:4})),
orders:[{id:101,uid:3,items:[{n:'Veg Biryani',q:1,p:90},{n:'Masala Chai',q:1,p:15}],total:105,slot:1,token:'KH-101',status:'Preparing',at:'11:42'},
{id:102,uid:3,items:[{n:'Paneer Wrap',q:2,p:70}],total:140,slot:2,token:'KH-102',status:'Placed',at:'11:50'}]};
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||seed}catch(e){return seed}};
const emailOk=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

function Logo({go}){return <button className="logo" onClick={()=>go('home')} aria-label="Kitchen House home"><i>🍽️</i>Kitchen House</button>}
function Field({label,err,...p}){return <div><label>{label}</label><input {...p}/>{err&&<div className="err">{err}</div>}</div>}
function Stepper({status}){const i=STAGES.indexOf(status);return <div className="track">{STAGES.map((s,k)=><div key={s} className={k<=i?'d':''}>{s}</div>)}</div>}
function Dish({m,children}){return <div className={'card dish'+(m.on?'':' off')}><div className="art" style={{background:m.bg}}>{m.e}</div><div className="in"><b>{m.name}</b><span className="muted" style={{fontSize:13}}>{m.cat}</span><div className="row"><span className="price">₹{m.price}</span>{children}</div></div></div>}
function Header({title,sub,user,out}){return <div className="top"><div><h2>{title}</h2><span className="muted">{sub}</span></div></div>}
function Tabs({tabs,v,set}){return <div className="tabs" role="tablist">{tabs.map(t=><button key={t[0]} role="tab" aria-selected={v===t[0]} className={'tab'+(v===t[0]?' on':'')} onClick={()=>set(t[0])}>{t[1]}</button>)}</div>}
const free=(db,s)=>s.cap-db.orders.filter(o=>o.slot===s.id).length;

function Landing({go,db}){
 return <div className="wrap"><section className="hero"><div>
  <h1>Order Smart. <em>Skip the Queue!</em></h1>
  <p>Pre-order from the college canteen, get an automatic pickup slot and a digital token, and walk in just as your food comes off the counter.</p>
  <div className="cta"><button className="btn" onClick={()=>go('register')}>Create student account</button><button className="btn ghost" onClick={()=>go('login')}>Log in</button></div></div>
  <div className="plate">🍛<b style={{top:'4%',right:'6%'}}>🥟</b><b style={{bottom:'8%',left:'2%'}}>🧋</b><b style={{bottom:'0',right:'12%'}}>🥞</b></div></section>
  <h2 style={{fontSize:28,marginBottom:14}}>Fresh on today’s menu</h2>
  <div className="grid">{db.menu.slice(0,4).map(m=><Dish key={m.id} m={m}/>)}</div>
  <div className="steps" style={{marginTop:36}}>{[['📱','Pick your food','Browse the menu and fill your cart from anywhere on campus.'],['🎟️','Get a token','A pickup slot is assigned automatically and a token is generated.'],['✅','Collect and go','Track your order live and pick it up when it is Ready.']].map(s=><div className="card" key={s[1]}><span>{s[0]}</span><h3 style={{margin:'8px 0 4px'}}>{s[1]}</h3><p className="muted" style={{margin:0}}>{s[2]}</p></div>)}</div></div>}

function Auth({mode,go,db,setDb,say}){
 const [f,setF]=useState({name:'',roll:'',email:'',phone:'',pw:'',pw2:''}),[e,setE]=useState({});
 const reg=mode==='register',on=k=>ev=>setF({...f,[k]:ev.target.value});
 function submit(ev){ev.preventDefault();const x={};
  if(!emailOk(f.email))x.email='Enter a valid email address.';
  if(f.pw.length<6)x.pw='Password needs at least 6 characters.';
  if(reg){if(f.name.trim().length<2)x.name='Enter your full name.';
   if(!/^[A-Za-z0-9]{5,12}$/.test(f.roll))x.roll='Roll number should be 5–12 letters or digits.';
   if(!/^\d{10}$/.test(f.phone))x.phone='Phone must be 10 digits.';
   if(f.pw!==f.pw2)x.pw2='Passwords do not match.';
   if(db.users.some(u=>u.email===f.email.toLowerCase()))x.email='This email is already registered.'}
  setE(x);if(Object.keys(x).length)return;
  if(reg){const u={id:Date.now(),name:f.name.trim(),roll:f.roll,email:f.email.toLowerCase(),phone:f.phone,pw:f.pw,role:'student'};
   setDb({...db,users:[...db.users,u],session:u.id});say('Welcome to Kitchen House!');go('student')}
  else{const u=db.users.find(u=>u.email===f.email.toLowerCase()&&u.pw===f.pw);
   if(!u){setE({pw:'Email or password is incorrect.'});return}
   setDb({...db,session:u.id});say('Logged in as '+u.name);go(u.role)}}
 return <div className="wrap"><form className="card auth" onSubmit={submit} noValidate>
  <h2>{reg?'Student registration':'Log in'}</h2><p className="muted" style={{margin:0}}>{reg?'Only students can sign up. Staff accounts are created by the admin.':'Students, kitchen staff and admins all log in here.'}</p>
  {reg&&<><Field label="Full name" value={f.name} onChange={on('name')} err={e.name}/><div className="two"><Field label="Roll number" value={f.roll} onChange={on('roll')} err={e.roll}/><Field label="Phone" value={f.phone} onChange={on('phone')} err={e.phone} inputMode="numeric"/></div></>}
  <Field label="Email" type="email" value={f.email} onChange={on('email')} err={e.email} autoComplete="email"/>
  <Field label="Password" type="password" value={f.pw} onChange={on('pw')} err={e.pw} autoComplete={reg?'new-password':'current-password'}/>
  {reg&&<Field label="Confirm password" type="password" value={f.pw2} onChange={on('pw2')} err={e.pw2}/>}
  <button className="btn" style={{width:'100%',marginTop:18}}>{reg?'Create account':'Log in'}</button>
  <p style={{textAlign:'center',marginBottom:0}}>{reg?'Have an account? ':'New student? '}<a href="#" onClick={ev=>{ev.preventDefault();go(reg?'login':'register')}} style={{color:'var(--or2)',fontWeight:700}}>{reg?'Log in':'Register'}</a></p>
  {!reg&&<div className="hint"><b>Demo logins</b><br/>Student: student@college.edu / student123<br/>Kitchen: kitchen@kitchenhouse.edu / kitchen123<br/>Admin: admin@kitchenhouse.edu / admin123</div>}
 </form></div>}

function Student({db,setDb,user,say,tab,go,cart,setCart}){
 const setTab=go,[q,setQ]=useState(''),[cat,setCat]=useState('All'),[slot,setSlot]=useState('auto');
 const cats=['All',...new Set(db.menu.map(m=>m.cat))];
 const list=db.menu.filter(m=>(cat==='All'||m.cat===cat)&&m.name.toLowerCase().includes(q.toLowerCase()));
 const lines=db.menu.filter(m=>cart[m.id]).map(m=>({...m,q:cart[m.id]})),total=lines.reduce((s,l)=>s+l.q*l.price,0),count=lines.reduce((s,l)=>s+l.q,0);
 const add=(id,d)=>setCart(c=>{const n=(c[id]||0)+d,x={...c};n<=0?delete x[id]:x[id]=n;return x});
 const mine=db.orders.filter(o=>o.uid===user.id).sort((a,b)=>b.id-a.id);
 function place(){
  const open=db.slots.filter(s=>free(db,s)>0);if(!open.length){say('All pickup slots are full for today.');return}
  const s=slot==='auto'?open[0]:db.slots.find(s=>s.id===+slot);if(!s||free(db,s)<=0){say('That slot just filled up. Pick another.');return}
  const n=db.tok+1,o={id:n,uid:user.id,items:lines.map(l=>({n:l.name,q:l.q,p:l.price})),total,slot:s.id,token:'KH-'+n,status:'Placed',at:new Date().toTimeString().slice(0,5)};
  setDb({...db,tok:n,orders:[...db.orders,o]});setCart({});setSlot('auto');setTab('orders');say('Order placed! Token '+o.token+' · pickup '+s.time)}
 return <div className="wrap"><Header title={'Hi, '+user.name.split(' ')[0]+' 👋'} sub="What are you craving today?"/>
  <Tabs v={tab} set={setTab} tabs={[['menu','Menu'],['cart','Cart ('+count+')'],['orders','My orders']]}/>
  {tab==='menu'&&<><input placeholder="Search dishes…" aria-label="Search dishes" value={q} onChange={e=>setQ(e.target.value)}/>
   <div className="tabs">{cats.map(c=><button key={c} className={'tab'+(cat===c?' on':'')} onClick={()=>setCat(c)}>{c}</button>)}</div>
   {list.length?<div className="grid">{list.map(m=><Dish key={m.id} m={m}>{m.on?<button className="btn sm" onClick={()=>{add(m.id,1);say(m.name+' added')}}>Add</button>:<span className="pill">Sold out</span>}</Dish>)}</div>:<p className="muted">No dishes match “{q}”. Try another word or category.</p>}</>}
  {tab==='cart'&&(count?<div className="cols"><div className="list">{lines.map(l=><div className="card oh" key={l.id}><span style={{fontSize:34}}>{l.e}</span><b style={{flex:1}}>{l.name}<br/><span className="muted" style={{fontWeight:400}}>₹{l.price} each</span></b><span className="qty"><button aria-label="Less" onClick={()=>add(l.id,-1)}>−</button>{l.q}<button aria-label="More" onClick={()=>add(l.id,1)}>+</button></span><b>₹{l.q*l.price}</b></div>)}</div>
   <div className="card"><h3>Pickup slot</h3><label htmlFor="sl">Choose a time</label><select id="sl" value={slot} onChange={e=>setSlot(e.target.value)}><option value="auto">Auto-assign best slot</option>{db.slots.map(s=><option key={s.id} value={s.id} disabled={free(db,s)<=0}>{s.time} · {free(db,s)>0?free(db,s)+' left':'Full'}</option>)}</select>
   <div className="oh" style={{margin:'16px 0'}}><span>Total</span><span className="price" style={{fontSize:26}}>₹{total}</span></div><button className="btn" style={{width:'100%'}} onClick={place}>Place order</button></div></div>
   :<div className="card"><h3>Your cart is empty</h3><p className="muted">Add something tasty from the menu.</p><button className="btn" onClick={()=>setTab('menu')}>Browse menu</button></div>)}
  {tab==='orders'&&(mine.length?<div className="list">{mine.map(o=><div className="card" key={o.id}><div className="oh"><span className="token">{o.token}</span><span className="pill">{o.status}</span><span className="muted">Pickup {db.slots.find(s=>s.id===o.slot)?.time} · placed {o.at}</span></div>
   <Stepper status={o.status}/><p style={{margin:'8px 0 0'}}>{o.items.map(i=>i.q+'× '+i.n).join(', ')} — <b>₹{o.total}</b></p></div>)}</div>:<div className="card"><h3>No orders yet</h3><p className="muted">Your orders and tokens will show up here.</p></div>)}
 </div>}

function Kitchen({db,setDb,say,tab,go}){
 const setTab=p=>go('kitchen-'+p);const name=id=>db.users.find(u=>u.id===id)?.name||'Student';
 const sel={new:o=>o.status==='Placed',active:o=>['Accepted','Preparing','Ready'].includes(o.status),done:o=>o.status==='Completed'};
 const adv=o=>{const s=STAGES[STAGES.indexOf(o.status)+1];setDb({...db,orders:db.orders.map(x=>x.id===o.id?{...x,status:s}:x)});say(o.token+' → '+s)};
 const list=db.orders.filter(sel[tab]).sort((a,b)=>a.slot-b.slot);
 return <div className="wrap"><Header title="Kitchen board" sub="Orders are sorted by pickup slot."/>
  <div className="stats">{[['New','new'],['In progress','active'],['Completed','done']].map(s=><div className="card" key={s[1]}><b>{db.orders.filter(sel[s[1]]).length}</b>{s[0]}</div>)}</div>
  <Tabs v={tab} set={setTab} tabs={[['new','Incoming'],['active','In progress'],['done','Completed']]}/>
  {list.length?<div className="grid" style={{gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))'}}>{list.map(o=><div className="card" key={o.id}><div className="oh"><span className="token">{o.token}</span><span className={'pill '+o.status}>{o.status}</span></div>
   <p style={{margin:'10px 0 2px'}}><b>{name(o.uid)}</b><br/><span className="muted">Pickup {db.slots.find(s=>s.id===o.slot)?.time}</span></p>
   <ul style={{paddingLeft:18,margin:'8px 0 12px'}}>{o.items.map((i,k)=><li key={k}>{i.q}× {i.n}</li>)}</ul>
   {NEXT[o.status]&&<button className="btn" style={{width:'100%'}} onClick={()=>adv(o)}>{NEXT[o.status]}</button>}</div>)}</div>:<div className="card"><h3>Nothing here</h3><p className="muted">New orders appear the moment a student places them.</p></div>}
 </div>}

function Admin({db,setDb,say,tab,go}){
 const setTab=p=>go('admin-'+p),[n,setN]=useState({name:'',price:'',cat:'Snacks'}),[st,setSt]=useState({name:'',email:'',pw:''}),[ns,setNs]=useState(''),[e,setE]=useState({});
 const upMenu=(id,p)=>setDb({...db,menu:db.menu.map(m=>m.id===id?{...m,...p}:m)});
 const emo={Breakfast:'🥞',Meals:'🍛',Snacks:'🥪',Drinks:'🥤',Desserts:'🍰'};
 function addItem(ev){ev.preventDefault();const x={};if(n.name.trim().length<2)x.name='Enter an item name.';if(!(+n.price>0))x.price='Enter a price above 0.';setE(x);if(Object.keys(x).length)return;
  setDb({...db,menu:[...db.menu,{id:Date.now(),name:n.name.trim(),price:+n.price,cat:n.cat,e:emo[n.cat],bg:'#FFE3C7',on:true}]});setN({name:'',price:'',cat:'Snacks'});say('Item added')}
 function addStaff(ev){ev.preventDefault();const x={};if(st.name.trim().length<2)x.sn='Enter the staff name.';if(!emailOk(st.email))x.se='Enter a valid email.';if(st.pw.length<6)x.sp='Password needs 6+ characters.';
  if(db.users.some(u=>u.email===st.email.toLowerCase()))x.se='Email already in use.';setE(x);if(Object.keys(x).length)return;
  setDb({...db,users:[...db.users,{id:Date.now(),name:st.name.trim(),email:st.email.toLowerCase(),pw:st.pw,role:'kitchen'}]});setSt({name:'',email:'',pw:''});say('Staff account created')}
 const rev=db.orders.reduce((s,o)=>s+o.total,0),staff=db.users.filter(u=>u.role==='kitchen');
 return <div className="wrap"><Header title="Admin console" sub="Manage the menu, staff, orders and pickup slots."/>
  <div className="stats">{[[db.orders.length,'Orders'],['₹'+rev,'Sales'],[db.menu.length,'Menu items'],[staff.length,'Kitchen staff']].map(s=><div className="card" key={s[1]}><b>{s[0]}</b>{s[1]}</div>)}</div>
  <Tabs v={tab} set={setTab} tabs={[['items','Food items'],['staff','Staff'],['orders','Orders'],['slots','Pickup slots']]}/>
  {tab==='items'&&<><form className="card two" onSubmit={addItem} noValidate style={{gridTemplateColumns:'2fr 1fr 1fr auto',alignItems:'end',marginBottom:14}}><Field label="New item" value={n.name} onChange={ev=>setN({...n,name:ev.target.value})} err={e.name}/><Field label="Price ₹" type="number" value={n.price} onChange={ev=>setN({...n,price:ev.target.value})} err={e.price}/><div><label>Category</label><select value={n.cat} onChange={ev=>setN({...n,cat:ev.target.value})}>{Object.keys(emo).map(c=><option key={c}>{c}</option>)}</select></div><button className="btn">Add</button></form>
   <div className="card tw"><table><thead><tr><th>Item</th><th>Price ₹</th><th>Status</th><th></th></tr></thead><tbody>{db.menu.map(m=><tr key={m.id}><td>{m.e} {m.name}</td><td><input style={{width:84}} type="number" min="1" value={m.price} aria-label={'Price of '+m.name} onChange={ev=>upMenu(m.id,{price:Math.max(1,+ev.target.value)})}/></td><td><button className="btn ghost sm" onClick={()=>upMenu(m.id,{on:!m.on})}>{m.on?'Available':'Sold out'}</button></td><td><button className="btn bad sm" onClick={()=>{setDb({...db,menu:db.menu.filter(x=>x.id!==m.id)});say('Item removed')}}>Delete</button></td></tr>)}</tbody></table></div></>}
  {tab==='staff'&&<div className="cols"><div className="card tw"><table><thead><tr><th>Name</th><th>Email</th><th></th></tr></thead><tbody>{staff.map(u=><tr key={u.id}><td>{u.name}</td><td>{u.email}</td><td><button className="btn bad sm" onClick={()=>{setDb({...db,users:db.users.filter(x=>x.id!==u.id)});say('Staff removed')}}>Remove</button></td></tr>)}</tbody></table></div>
   <form className="card" onSubmit={addStaff} noValidate><h3>Create kitchen staff</h3><Field label="Name" value={st.name} onChange={ev=>setSt({...st,name:ev.target.value})} err={e.sn}/><Field label="Email" value={st.email} onChange={ev=>setSt({...st,email:ev.target.value})} err={e.se}/><Field label="Temporary password" type="password" value={st.pw} onChange={ev=>setSt({...st,pw:ev.target.value})} err={e.sp}/><button className="btn" style={{marginTop:16,width:'100%'}}>Create account</button></form></div>}
  {tab==='orders'&&<div className="card tw"><table><thead><tr><th>Token</th><th>Items</th><th>Total</th><th>Slot</th><th>Status</th></tr></thead><tbody>{db.orders.map(o=><tr key={o.id}><td><b>{o.token}</b></td><td>{o.items.map(i=>i.q+'× '+i.n).join(', ')}</td><td>₹{o.total}</td><td>{db.slots.find(s=>s.id===o.slot)?.time}</td><td><span className={'pill '+o.status}>{o.status}</span></td></tr>)}</tbody></table></div>}
  {tab==='slots'&&<><div className="grid">{db.slots.map(s=>{const used=s.cap-free(db,s);return <div className="card" key={s.id}><div className="oh"><h3>{s.time}</h3><button className="btn bad sm" onClick={()=>setDb({...db,slots:db.slots.filter(x=>x.id!==s.id)})}>Remove</button></div>
   <div className="bar" style={{margin:'10px 0'}}><i style={{width:Math.min(100,used/s.cap*100)+'%'}}/></div><div className="oh"><span className="muted">{used} of {s.cap} booked</span><span className="qty"><button aria-label="Reduce capacity" onClick={()=>setDb({...db,slots:db.slots.map(x=>x.id===s.id?{...x,cap:Math.max(1,x.cap-1)}:x)})}>−</button>{s.cap}<button aria-label="Increase capacity" onClick={()=>setDb({...db,slots:db.slots.map(x=>x.id===s.id?{...x,cap:x.cap+1}:x)})}>+</button></span></div></div>})}</div>
   <form className="card oh" style={{marginTop:14}} onSubmit={ev=>{ev.preventDefault();if(!ns||db.slots.some(s=>s.time===ns)){say('Pick a time that is not already a slot.');return}setDb({...db,slots:[...db.slots,{id:Date.now(),time:ns,cap:4}].sort((a,b)=>a.time.localeCompare(b.time))});setNs('');say('Slot added')}}><label style={{margin:0}}>New slot</label><input type="time" style={{width:160}} value={ns} onChange={ev=>setNs(ev.target.value)}/><button className="btn">Add slot</button></form></>}
 </div>}

function App(){
 const [db,setDb]=useState(load),[page,setPage]=useState(()=>location.hash.slice(1)||'home'),[toast,setToast]=useState(''),[cart,setCart]=useState({});
 useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}},[db]);
 const user=db.users.find(u=>u.id===db.session);
 const go=p=>{setPage(p);try{location.hash=p}catch(e){}window.scrollTo(0,0)};
 useEffect(()=>{const h=()=>setPage(location.hash.slice(1)||'home');addEventListener('hashchange',h);return()=>removeEventListener('hashchange',h)},[]);
 const say=m=>{setToast(m);clearTimeout(window.__t);window.__t=setTimeout(()=>setToast(''),2600)};
 const roleOf={student:'student',menu:'student',cart:'student',orders:'student',kitchen:'kitchen',admin:'admin'}[page.split('-')[0]],home={student:'menu',kitchen:'kitchen',admin:'admin'};
 let view=page;if(roleOf&&(!user||user.role!==roleOf))view=user?home[user.role]:'login';
 if(['login','register'].includes(page)&&user)view=home[user.role];
 if(view==='student')view='menu';
 const logout=()=>{setDb({...db,session:null});setCart({});say('Logged out');go('home')};
 return <><nav><div className="wrap"><Logo go={go}/><span className="sp"/>
  {user?<><span className="muted hide">{user.name} · {user.role}</span><button className="btn ghost sm" onClick={()=>go(user.role)}>Dashboard</button><button className="btn sm" onClick={logout}>Log out</button></>
  :<><button className="btn ghost sm" onClick={()=>go('login')}>Log in</button><button className="btn sm" onClick={()=>go('register')}>Register</button></>}</div></nav>
  {view==='home'&&<Landing go={go} db={db}/>}
  {(view==='login'||view==='register')&&<Auth key={view} mode={view} go={go} db={db} setDb={setDb} say={say}/>}
  {['menu','cart','orders'].includes(view)&&<Student db={db} setDb={setDb} user={user} say={say} tab={view} go={go} cart={cart} setCart={setCart}/>}
  {view.startsWith('kitchen')&&<Kitchen db={db} setDb={setDb} say={say} tab={view.split('-')[1]||'new'} go={go}/>}
  {view.startsWith('admin')&&<Admin db={db} setDb={setDb} say={say} tab={view.split('-')[1]||'items'} go={go}/>}
  <footer>Kitchen House · Order Smart. Skip the Queue!</footer>
  {toast&&<div className="toast" role="status">{toast}</div>}</>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
